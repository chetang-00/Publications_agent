[project]
name = "publications-agent"
version = "0.1.0"
description = "Research publications agent: FastAPI backend with tool calling and an agent loop"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22",
    "alembic>=1.20",
    "fastapi>=0.142",
    "httpx>=0.28",
    "openai>=3.24",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "pypdf[crypto]>=6.19",
    "python-docx>=1.2",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.19",
    "sqlalchemy[asyncio]>=2.1",
    "uvicorn[standard]>=0.54",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "reportlab>=5.0",
    "respx>=0.23",
    "ruff>=0.16",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: calls the real Portkey gateway (run with RUN_LIVE=1)"]
addopts = "-m 'not live' --strict-markers"
filterwarnings = [
    "error::pytest.PytestUnraisableExceptionWarning",
    "ignore:Payload indexes have no effect in the local Qdrant:UserWarning",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85  # acceptance criterion: backend coverage >= 85%

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]  # line length is the formatter's job

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
known-first-party = ["app"]
